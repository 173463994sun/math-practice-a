<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学1013-V42</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#23364a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.65}header,main{max-width:1100px;margin:auto;padding:22px}header{padding-bottom:4px}h1{font-size:28px;margin:0}h2{font-size:24px;margin:8px 0 20px}h3{font-size:18px;margin:0 0 10px}p{margin:10px 0}small,.muted{color:#66778a;font-size:13px}.map,.card,.end{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 20px #20375008}.map{padding:16px 22px;margin-bottom:22px}.mapline{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #d5dfeb;border-radius:9px;padding:5px 12px;font-size:13px}.current{background:#1767ba;color:white;border-color:#1767ba}.walked{background:#eaf4ee;color:#3b6651}.layout{display:grid;grid-template-columns:1fr;gap:20px}.layout.has-help{grid-template-columns:1.1fr 1fr}.stem{font-size:21px;line-height:1.9}.support{background:#edf5ff;border-left:4px solid #428cda;padding:20px;border-radius:10px}.support p,.support li{font-size:17px}.model-title{font-size:15px;font-weight:600;margin-top:12px}.total-bar{display:grid;border:2px solid #6696c5;border-radius:6px;overflow:hidden}.total-bar span{padding:8px 3px;background:#dcecff;border-right:1px solid #6696c5;text-align:center;font-size:15px}.total-bar span:last-child{border:0}.total-bar .extra{background:#fff1d5}.model-label{font-size:14px!important;color:#516c87}.layout>div,.support{min-width:0}.units{display:flex;gap:6px;flex-wrap:wrap}.units span{border:1px solid #70a5d8;padding:8px;border-radius:5px}.bar{border:2px solid #7fa8cd;padding:8px;border-radius:7px}.bar span{display:inline-block;background:#dcecff;padding:5px;margin:5px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d6e3ef;padding:8px;text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button,.link{border:1px solid #c8d8e8;border-radius:9px;padding:10px 16px;background:white;color:#245078;font:inherit;cursor:pointer}button.primary{background:#1767ba;color:white;border-color:#1767ba}button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;height:auto;line-height:1.5;max-width:100%;vertical-align:middle}.read{width:46px;height:46px;padding:0;flex:none}.actions button{padding:10px 16px;line-height:24px}button:hover{filter:brightness(.96)}.badge{font-size:13px;display:inline-block;border-radius:8px;background:#e8f0fa;padding:4px 10px}.locator{margin-top:24px;padding-top:12px;border-top:1px solid #edf0f5}.route{display:flex;gap:7px;margin-top:12px}.route button{font-size:13px;padding:6px 12px}footer{max-width:1100px;margin:0 auto 30px;padding:0 22px;font-size:13px;color:#6d7d8e}ol{padding-left:22px}@media(max-width:760px){header,main{padding:14px}.layout.has-help{grid-template-columns:1fr}.card{padding:20px}.stem{font-size:19px}h1{font-size:23px}.actions{display:block}.actions button{display:block;width:100%;margin:8px 0}}</style><header><small>数学1013-V42 · 第四单元</small><h1>同样的数量，怎样比较？</h1><p>今天先走6题；需要补教时，走一条接续路线就停。口答、指图也可以。</p></header><main><section class="map" data-component="knowledge-map"><strong>四上知识地图</strong><div class="mapline"><span class="chip walked">1 万以上数的认识</span><span class="chip walked">2 角的度量</span><span class="chip walked">3 多位数乘两位数</span><span class="chip current">4 加法模型和乘法模型</span><span class="chip ">5 平行四边形和梯形</span><span class="chip ">6 条形统计图</span><span class="chip ">7 复习与关联</span></div><small>浅绿：前序单元　蓝色：本单主题　空白：后续单元</small><div class="mapline"><span class="chip ">总量与分量</span><span class="chip ">换一种分类</span><span class="chip ">单价·数量·总价</span><span class="chip current">同数量价差</span><span class="chip ">方案与约束</span><span class="chip ">速度·时间·路程</span></div></section><div id="task"></div></main><footer>01—15为固定定位号；今天默认01、02、05、06、08、09。<br><a href="core-writing.pdf">核心手写PDF</a><br>记录只下载到本设备，不自动上传。</footer><script>
const items=[{"number": "01", "stem": "98名学生参加舞蹈、科技、美术社团，每人只参加一个。舞蹈男6女20，科技男25女生人数未显示，美术男17女18。（1）舞蹈和美术共有多少人？（2）三个社团共有多少女生？", "title": "换一种分类", "source": "现行教材印刷60 / PDF63，社团分类", "default": true, "cold": false}, {"number": "02", "stem": "学校买12本同样的书，每本原价28元，现在每本23元。按现在的价格买这12本书，比按原价买一共少花多少钱？", "title": "同样数量，比较费用", "source": "现行教材印刷63 / PDF66，例4", "default": true, "cold": false}, {"number": "03", "stem": "买9本同样的笔记本，每本原价32元，现价27元。一共比按原价买少花多少钱？", "title": "再用一次", "source": "现行教材印刷63 / PDF66，例4", "default": false, "cold": false}, {"number": "04", "stem": "买18套同样的用品，每套原价26元，现价23元。买这18套一共比原价便宜多少钱？", "title": "自己完成", "source": "现行教材印刷63 / PDF66，例4", "default": false, "cold": true}, {"number": "05", "stem": "商场促销，买6袋同样的大米，总价330元，比按原价购买便宜90元。这种大米原价每袋多少钱？", "title": "找回原价", "source": "现行教材印刷63 / PDF66，大米原价题", "default": true, "cold": false}, {"number": "06", "stem": "上次买8本同样的书，每本35元；这次买10本，每本30元。这次总共付的钱比上次多还是少？相差多少？", "title": "两次购买", "source": "现行教材印刷63 / PDF66，价差条件边界变式", "default": true, "cold": false}, {"number": "07", "stem": "小明每分钟走78米，小红每分钟走72米，两人都走了5分钟。小明比小红多走多少米？", "title": "换到路程", "source": "现行教材印刷66 / PDF69，速度比较", "default": false, "cold": false}, {"number": "08", "stem": "甲数是62，比乙数的7倍多6。甲、乙两数的和是多少？", "title": "原来的量还在", "source": "《4.6解决问题》第3题", "default": true, "cold": false}, {"number": "09", "stem": "甲数是69，比乙数的5倍多9。甲、乙两数的和是多少？", "title": "自己完成", "source": "《4.6解决问题》第3题", "default": true, "cold": true}, {"number": "10", "stem": "图书角有科技书126本，比故事书的4倍多6本。科技书和故事书一共有多少本？", "title": "换成两类书", "source": "《4.6解决问题》第3题", "default": false, "cold": false}, {"number": "11", "stem": "108名学生参加舞蹈、科技、美术社团，每人只参加一个。舞蹈男7女21，科技男30女生人数未显示，美术男20女18。（1）舞蹈和美术共有多少人？（2）三个社团共有多少女生？", "title": "再看一批人", "source": "现行教材印刷60 / PDF63，社团分类", "default": false, "cold": true}, {"number": "12", "stem": "买7袋同样的大米，总价392元，比按原价购买便宜84元。这种大米原价每袋多少钱？", "title": "再找原价", "source": "现行教材印刷63 / PDF66，大米原价题", "default": false, "cold": true}, {"number": "13", "stem": "上次买12支同样的彩笔，每支9元；这次买15支，每支7元。这次总共付的钱比上次多还是少？相差多少？", "title": "换一次购买", "source": "现行教材印刷63 / PDF66，价差条件边界变式", "default": false, "cold": true}, {"number": "14", "stem": "甲仓原有86箱货物。从甲仓运走6箱后，甲仓剩下的箱数正好是乙仓的4倍，乙仓没有运入或运出货物。运货前，两仓一共有多少箱货物？", "title": "运货前后", "source": "《4.6解决问题》第3题", "default": false, "cold": true}], supports={"01": "<h3>用另一小组看一看</h3><table><tr><th>社团</th><th>男生</th><th>女生</th></tr><tr><td>A</td><td>1</td><td>2</td></tr><tr><td>B</td><td>2</td><td>1</td></tr><tr><td>C</td><td>1</td><td>1</td></tr></table><p>按社团分是3、3、2人；按男女分是4、4人。分法变了，还是这8个人。</p><ol><li>回到本题：问题要找哪一类？</li><li>哪些人数属于这一类？</li><li>你的结果回答了整个问题吗？</li></ol>", "02": "<h3>用另一笔购买看一看</h3><p>4千克苹果，每千克原来12元，现在9元。</p><div class=\"units\"><span>少3元</span><span>少3元</span><span>少3元</span><span>少3元</span></div><p>每千克少3元，4千克共少12元。也可以算原来的48元与现在的36元，相差12元。</p><p>两种方法比的都是同样4千克的费用。</p><ol><li>回到本题：比较哪两笔费用？</li><li>买的数量相同吗？</li><li>你算出的数回答了什么？</li></ol>", "03": "<h3>接着用</h3><ol><li>比较哪两笔费用？</li><li>数量有没有改变？</li><li>最后的数回答什么？</li></ol>", "05": "<h3>用另一笔购买看一看</h3><p>3件东西现在共42元，比原来少12元。</p><div class=\"model-title\">原来3件共54元</div><div class=\"total-bar\" style=\"grid-template-columns:7fr 2fr\"><span>现在42元</span><span class=\"extra\">省下12元</span></div><p>把省下的12元补回来，才是原来3件的总钱数54元。每件原价是18元。</p><ol><li>回到本题：已经知道的是哪一次的钱？</li><li>少花的钱在两次费用之间是什么？</li><li>最后问总钱数，还是每袋的价格？</li></ol>", "06": "<h3>用另两次购买看一看</h3><table><tr><th></th><th>数量</th><th>每件</th><th>共付</th></tr><tr><td>上次</td><td>3件</td><td>8元</td><td>24元</td></tr><tr><td>这次</td><td>5件</td><td>6元</td><td>30元</td></tr></table><p>每件便宜了，但买得更多。这两次共付的钱，要分别看。</p><ol><li>回到本题：两次各买多少？</li><li>每个价格属于哪次购买？</li><li>题目比较的是什么？</li></ol>", "08": "<h3>先看一个小例子</h3><p>甲是26，比乙的4倍多2。</p><div class=\"model-title\">原甲26：完整的一条</div><div class=\"total-bar\" style=\"grid-template-columns:3fr 3fr 3fr 3fr 1fr\"><span>乙</span><span>乙</span><span>乙</span><span>乙</span><span class=\"extra\">2</span></div><p class=\"model-label\">前面四个相同的小段：4份乙，共24。</p><p>去掉2，剩下24，只是4份乙。每份乙是6。</p><p><strong>原甲仍是26。</strong>24是为了找乙得到的中间量，不能把它当成原甲。</p><p>先指一指：哪段是4份乙，哪里是原甲的全部？再回本题。</p><ol><li>回到本题：刚求出的数是谁？</li><li>哪一个是原来完整的量？</li><li>最后要合计哪些量？</li></ol>"}, normal=['01','02','05','06','08','09'];
const params=new URLSearchParams(location.search), direct=params.get('q');
// QA uses an isolated local key; it never supplies child evidence.
const storageKey=params.get('qa')==='1'?'math-practice-a-v42-qa':'math-practice-a-v42-progress';
let q=direct||'01',helped=false,branch=false,queue=[],finished=[],stage='active',resumeDefault=null,stopMessage='',restored=false,entryQuery=direct||null,storageSaved=true;
const branches={'01':['11'],'02':['03','04'],'05':['12'],'06':['13']};
const $=id=>document.getElementById(id), valid=n=>items.some(i=>i.number===n);
try{const s=JSON.parse(localStorage.getItem(storageKey));if(s&&s.schema===1&&valid(s.current)&&['active','paused','segment_complete','complete'].includes(s.stage)){
 q=s.current;helped=!!s.current_help_visible;branch=!!s.branch;queue=Array.isArray(s.remaining_branch)?s.remaining_branch.filter(valid).slice(0,3):[];
 finished=Array.isArray(s.finished)?s.finished.filter(x=>x&&valid(x.number)).slice(0,30).map(x=>({number:x.number,help_visible:!!x.help_visible,help_used:'未知；可见不等于使用',self_report:'做完了；未判正确或掌握'})):[];
 stage=s.stage;resumeDefault=normal.includes(s.next_default)?s.next_default:null;stopMessage=s.stage==='paused'?'上次先停在这里，接着未完成的题。':s.stage==='segment_complete'?'上次这条接续路线已结束，下一适宜段再继续。':'本段已做过，先停在这里。';restored=true;entryQuery=s.entry_query??null;
}}catch(e){}
if(direct&&(!restored||entryQuery!==direct)){entryQuery=direct;q=direct;helped=false;branch=false;queue=[];stage='active';resumeDefault=null;stopMessage='';restored=false}
if(direct==='03'&&!restored){branch=true;queue=['04'];resumeDefault=nextNormal('02')}
if(!valid(q))q='01';
function state(){return {schema:1,sheet:'1013-V42',type:'SELF_REPORTED_LOCAL_NOT_RUN',entry_query:entryQuery,current:q,current_help_visible:helped,actual_help_used:'UNKNOWN',branch,remaining_branch:queue.slice(),finished:finished.slice(),stage,next_default:resumeDefault,pending_question:stage==='paused'?q:stage==='segment_complete'?resumeDefault:null,pause_note:stopMessage}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state()));storageSaved=true}catch(e){storageSaved=false}return storageSaved}
function render(keepHelp=false){let x=items.find(i=>i.number===q);if(!x){stop('先停在这里，下一段再继续。');return}if(!keepHelp)helped=q==='08'||q==='03';stage='active';draw(x);save()}
function draw(x){let help=helped&&supports[q]?'<aside class="support">'+supports[q]+'</aside>':'';let tag=q==='08'?'默认 · 先看例子':x.default?'默认':x.cold?'按需要 · 不看提示完成':'按需要 · 接着用';$('task').innerHTML='<section class="card" data-question-id="1013-V42-'+q+'" data-source-id="U4-DISC-20261013-S'+q+'" data-item-role="'+(x.cold?'COLD_CANDIDATE':helped?'SUPPORTED':'NORMAL')+'"><span class="badge">'+q+' · '+tag+'</span><h2>'+x.title+'</h2><div class="layout '+(help?'has-help':'')+'"><div><p class="stem">'+x.stem+'</p><button class="read" onclick="read()" title="朗读题目" aria-label="朗读题目">🔊</button></div>'+help+'</div><div class="actions"><button class="primary" onclick="done()">我做完了，接着走</button>'+(!x.cold&&supports[q]&&!helped?'<button onclick="help()">需要接一步</button>':'')+'<button onclick="stop()">先停在这里</button></div><div class="locator muted">反馈定位：1013-V42-'+q+'<br>题源：'+x.source+'（受控改编，非原书原题）</div></section>'}
function help(){helped=true;draw(items.find(i=>i.number===q));save()}
function nextNormal(after){let k=normal.indexOf(after);return normal.slice(k+1).find(n=>!finished.some(x=>x.number===n))||null}
function done(){if(!finished.some(x=>x.number===q))finished.push({number:q,help_visible:helped,help_used:'未知；可见不等于使用',evidence_role:q==='09'&&finished.some(x=>x.number==='08')?'08后匹配观察候选':'题目观察候选',self_report:'做完了；未判正确或掌握'});
 if(branch){if(queue.length){q=queue.shift();render()}else stop('这条接续路线结束，现在可以休息。其他默认题留到下一适宜段。','segment_complete');return}
 if(helped&&branches[q]){resumeDefault=nextNormal(q);branch=true;queue=branches[q].slice();q=queue.shift();render();return}
 if(normal.includes(q)){let next=nextNormal(q);if(next){q=next;render();return}}
 resumeDefault=null;stop('本段已做过，先停在这里。做完不等于已经掌握。','complete')
}
function stop(msg,kind='paused'){stage=kind;stopMessage=msg||'卡住或疲劳就先保留现场。下次接着这道题，不从头重做。';save();showStop()}
function showStop(){let resume=stage==='paused'?'<button class="primary" onclick="resumeTask()">继续这道题（'+q+'）</button>':stage==='segment_complete'&&resumeDefault?'<button onclick="resumeSegment()">下一段从'+resumeDefault+'继续</button>':'';
 $('task').innerHTML='<section class="end"><h2>先停在这里</h2><p>'+stopMessage+'</p><p>'+(storageSaved?'本设备已记下：':'本设备未能保存，请点下方保存题号记录：')+(finished.map(x=>x.number).join('、')||'尚无已做题')+'。'+(stage==='paused'?'停在'+q+'。':'')+'</p><div class="actions">'+resume+'<button onclick="exportNotes()">保存本段题号记录</button></div><p class="muted">停点只保留在本设备；不自动判对，也不上传。</p></section>'
}
function resumeTask(){stopMessage='';render(true)}
function resumeSegment(){if(!resumeDefault)return;let next=resumeDefault;branch=false;queue=[];resumeDefault=null;stopMessage='';q=next;render()}
function exportNotes(){const b=new Blob([JSON.stringify(state(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='1013-V42-本段题号记录.json';a.click();URL.revokeObjectURL(a.href)}
if(stage==='active')render(restored);else showStop();

function read(){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(items.find(i=>i.number===q).stem);u.lang='zh-CN';speechSynthesis.speak(u)}catch(e){}}
</script></html>
